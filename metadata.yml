Status: Ready
Title: Projections against Coconut
Description: Projects a molecule onto a two-dimensional map of COCONUT, an aggregation
  of open natural product collections assembled by Sorokina and colleagues into the
  largest freely available resource of its kind. Placing a query against that backdrop
  shows whether it occupies well-populated natural product space or sits at its margins.
  Coordinates come from dimensionality reduction fitted to the reference set, so they
  express relative position and cannot be compared across differently trained projections.
